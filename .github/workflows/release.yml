name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build system archive
        run: zip -r monsterhearts2.zip system.json mh2.mjs README.md lang module styles templates

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            monsterhearts2.zip
            system.json
          generate_release_notes: true
